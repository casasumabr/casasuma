<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa SuMa</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    /* Estilo geral */
    body {
      font-family: Garamond, serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff; /* Fundo branco */
      cursor: url('cursor_suma_2.cur'), auto; /* Cursor personalizado */
    }

    /* Menu fixo no topo */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      padding: 10px 0;
      position: fixed; /* Fixa o menu no topo */
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    /* Contêiner do menu centralizado */
    .menu-container {
      display: flex;
      justify-content: center; /* Centraliza os botões horizontalmente */
      align-items: center;
      max-width: 90%; /* Largura alinhada à imagem principal */
      width: 100%;
      margin: 0 auto; /* Centraliza o menu horizontalmente */
    }

    /* Botões do menu como links */
    .menu-button {
      text-decoration: none;
      background-color: #ffffff;
      color: black;
      border-radius: 5px;
      padding: 10px 20px;
      margin: 0 15px; /* Espaçamento uniforme entre os botões */
      font-size: 16px;
      font-weight: regular;
      display: inline-block;
      transition: color 0.3s ease;
    }

    .menu-button:hover {
      color: #808080; /* Cor do texto ao passar o mouse */
    }

    /* Espaçamento abaixo do menu */
    .content {
      margin-top: 10px; /* Espaço suficiente para compensar o menu fixo */
      text-align: center;
    }

    /* Imagem principal */
    .main-image {
      max-width: 90%; /* Largura proporcional */
      max-height: 100vh;
      display: block;
      margin: 0 auto;
    }

    /* Ajuste para dispositivos menores (mobile) */
    @media (max-width: 768px) {
      .menu-container {
        max-width: 100%; /* Largura igual à imagem */
        flex-wrap: wrap; /* Permite que os botões quebrem linha */
        position: relative; /* Garante que não fique sobre a imagem */
        z-index: 10; /* Coloca o menu em um nível mais alto se necessário */
        background-color: white; /* Adiciona cor para garantir visibilidade *//
      }

      .menu-button {
        padding: 10px 18px; /* Botões menores */
        margin: 6px; /* Espaço menor entre os botões */
        font-size: 15px; /* Reduz tamanho da fonte */
      }

     .main-image {
        width: 100%; /* Ajusta largura para manter a proporção */
        max-width: 100%; /* Não ultrapassa a largura da tela */
        height: auto; /* Mantém a proporção */
        max-height: calc(100vh - 60px); /* Considera a altura do menu */
        object-fit: contain; /* Garante que a imagem seja exibida completa */
        object-position: top; /* Alinha ao topo para evitar cortes superiores */
        margin-top: 60px; /* Espaço abaixo do menu (ajuste o valor conforme necessário) */
        z-index: 1; /* Coloca a imagem em camada inferior */
        position: relative; /* Garante que não flutue ou seja sobreposta */
      }
    } 
  </style>
</head>
<body>
  <!-- Menu -->
  <nav>
    <div class="menu-container">
      <a href="https://www.airbnb.com/h/casasuma" target="_blank" class="menu-button">RESERVAS</a>
      <a href="https://www.instagram.com/casasuma" target="_blank" class="menu-button">INSTAGRAM</a>
      <a href="https://issuu.com/casasumabr/docs/guia_pratico_casa_suma?ff" target="_blank" class="menu-button">GUIA</a>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="content">
    <!-- Imagem principal com link -->
    <a href="https://www.airbnb.com/h/casasuma" target="_blank">
      <img src="postal_suma_tarde_site.jpg" alt="Descrição da Imagem" class="main-image">
    </a>
  </div>
</body>
</html>
