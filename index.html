<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa SuMa</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    /* Estilo geral */
    body {
      font-family: Garamond, serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff; /* Fundo branco */
      cursor: url('cursor_suma_2.cur'), auto; /* Cursor personalizado */
    }

    /* Menu fixo no topo */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #333;
      padding: 10px;
      position: fixed; /* Fixa o menu no topo */
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    /* Botões do menu como links */
    .menu-button {
      text-decoration: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 16px;
      font-weight: bold;
      display: inline-block;
      transition: background-color 0.3s ease;
    }

    .menu-button:hover {
      background-color: #0056b3;
    }

    /* Espaçamento abaixo do menu */
    .content {
      margin-top: 80px;
      text-align: center;
    }

    /* Imagem principal */
    .main-image {
      max-width: 100%;
      max-height: 100vh;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <!-- Menu -->
  <nav>
    <a href="https://www.airbnb.com/h/casasuma" target="_blank" class="menu-button">Reservas</a>
    <a href="https://www.instagram.com/casasuma" target="_blank" class="menu-button">Instagram</a>
    <a href="https://issuu.com/casasumabr/docs/guia_pratico_casa_suma?ff" target="_blank" class="menu-button">Guia</a>
  </nav>

  <!-- Conteúdo principal -->
  <div class="content">
    <!-- Imagem principal com link -->
    <a href="https://www.airbnb.com/h/casasuma" target="_blank">
      <img src="postal_suma_tarde_site.jpg" alt="Descrição da Imagem" class="main-image">
    </a>
